<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/groundhelp-icon-green.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroundHelp | Professional Lawn Care, Exterior Cleaning & GroundHelpClean | Lexington, SC</title>
    <meta name="description" content="GroundHelp provides unmatched recurring lawn care, landscaping, pressure washing, and dedicated residential cleaning (GroundHelpClean) across Lexington, SC & Lake Murray." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8faf8] text-slate-800 antialiased selection:bg-[#8ce03f] selection:text-[#141f17]">
    <!-- Hidden static forms for Netlify bot discovery in React SPA -->
    <form name="quote-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="zipCode" />
      <input type="text" name="serviceType" />
      <input type="text" name="propertySize" />
      <input type="text" name="frequency" />
      <input type="checkbox" name="bundleCleaning" />
      <input type="text" name="estimateBallpark" />
      <input type="text" name="bot-field" />
    </form>

    <form name="contact-message" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="commercial-rfp" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="organizationName" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="propertyType" />
      <input type="text" name="address" />
      <textarea name="notes"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
